# Builds Lizard Wizard for Windows on GitHub's machines (nothing to install locally).
# - Push a version tag (git tag v0.1.0 && git push origin v0.1.0): builds and posts a Release with the zip to download.
# - Or run it by hand (Actions tab > Release build > Run workflow): builds the zip as a downloadable artifact only.
name: Release build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # to create the Release

jobs:
  windows:
    runs-on: ubuntu-24.04
    env:
      GODOT_VERSION: "4.7.2"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Download Godot (.NET) and its export templates
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -fsSL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64.zip"
          curl -fsSL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_mono_export_templates.tpz"
          unzip -q godot.zip -d godot
          unzip -q templates.tpz -d templates
          dest="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable.mono"
          mkdir -p "$dest"
          mv templates/templates/* "$dest/"
          echo "GODOT=$(find "$PWD/godot" -type f -name 'Godot_v*_mono_linux.x86_64' | head -n 1)" >> "$GITHUB_ENV"

      - name: Normal start for players (the playtest settings are only for us)
        run: sed -i 's/^coins=.*/coins=0/' game/playtest.cfg

      - name: Export for Windows
        run: |
          chmod +x "$GODOT"
          mkdir -p build/windows
          # The first run imports the art (the .godot folder isn't in git).
          "$GODOT" --headless --path game --import || true
          "$GODOT" --headless --path game --export-release "Windows Desktop" ../build/windows/LizardWizard.exe
          ls -la build/windows
          test -f build/windows/LizardWizard.exe

      - name: Zip it
        run: |
          cd build/windows && zip -qr ../LizardWizard-windows.zip .

      - uses: actions/upload-artifact@v7
        with:
          name: LizardWizard-windows
          path: build/LizardWizard-windows.zip

      - name: Post the Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/LizardWizard-windows.zip \
            --title "Lizard Wizard $GITHUB_REF_NAME" \
            --notes "Download LizardWizard-windows.zip, unzip it anywhere and run LizardWizard.exe. Up to 4 players: controllers, or two on the keyboard. See the README for the controls."
