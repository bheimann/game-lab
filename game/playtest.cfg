; Playtest settings: change these to try things out quickly.
; The [new_game] ones are used when a NEW game starts (hold N on the start screen to throw the old save away);
; the [always] ones every time the game starts. Builds for family turn them all off (see .github/workflows/release.yml).
; Lines starting with ; are notes, the game ignores them.

[new_game]

; Coins the team starts with. 500 buys every weapon upgrade (20 + 40 + 80 + 160 = 300) with plenty left for herbs
; (10 each) and rests at the inn (5). The normal game starts with 0.
coins=500

[always]

; Wake every village's teleport (castle teleport rooms), so you can jump between villages straight away.
; Used every time the game starts. Normally they wake up when you touch each castle's crystal.
unlock_all_teleports=true
